name: Deploy Backend to HuggingFace Spaces

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: # Memungkinkan trigger manual

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Deploy backend to HuggingFace Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          SPACE_NAME: autoclipper-backend
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          username = os.environ.get("HF_USERNAME", "oyakjo")
          space_name = os.environ.get("SPACE_NAME", "autoclipper-backend")
          repo_id = f"{username}/{space_name}"

          api = HfApi(token=token)

          # Create space if it doesn't exist
          try:
              api.repo_info(repo_id=repo_id, repo_type="space")
              print(f"✅ Space {repo_id} already exists")
          except Exception:
              print(f"Creating space {repo_id}...")
              api.create_repo(
                  repo_id=repo_id,
                  repo_type="space",
                  space_sdk="docker",
                  private=False,
              )
              print(f"✅ Created space {repo_id}")

          # Upload backend folder
          api.upload_folder(
              folder_path="backend",
              repo_id=repo_id,
              repo_type="space",
              commit_message="Deploy backend via GitHub Actions",
              ignore_patterns=["*.pyc", "__pycache__", ".env", "*.egg-info", ".venv"],
          )
          print(f"✅ Backend deployed to https://huggingface.co/spaces/{repo_id}")
          EOF
